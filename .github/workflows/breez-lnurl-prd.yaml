name: breez-lnurl PRD CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOCKER_TAGS: lightningdotspacecom/breez-lnurl:latest

jobs:
  validate-ref:
    name: Validate ref
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Require exact ref (case-sensitive)
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Ref must be exactly refs/heads/main (got: $REF); GitHub's on.push.branches filter and if: expressions are case-insensitive"
            exit 1
          fi

  build-and-push:
    name: Build and push to PRD
    needs: validate-ref
    runs-on: ubuntu-24.04-arm
    concurrency:
      group: breez-lnurl-prd-deploy
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/breez-sdk/lnurl/Dockerfile
          push: true
          tags: ${{ env.DOCKER_TAGS }}
          platforms: linux/arm64
